<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="BUILD: 6 projects built end to end: UI, backend, database and deployment."><title>BUILD: 6 projects built end to end: UI, backend, database and deployment.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes drift{from{stroke-dashoffset:0}to{stroke-dashoffset:-120}}
.a{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.g{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.p{transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s ease-out both}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.drift{stroke-dasharray:6 14;animation:drift 12s linear infinite}
@media (prefers-reduced-motion:reduce){.a,.g,.p,.pulse,.drift{animation:none!important}}
</style><rect x="1.5" y="1.5" width="397" height="247" rx="26" fill="#790b13" stroke="#790b13" stroke-width="3"/><g class="a" style="animation-delay:0.20s"><text x="32" y="52" font-family="'RS Sans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#cc9990" text-anchor="start" letter-spacing="3.5">BUILD</text></g><g class="a" style="animation-delay:0.32s"><text x="30" y="150" font-family="'RS Serif','Instrument Serif',Georgia,'Times New Roman',serif" font-size="98" fill="#fff0dc" text-anchor="start" letter-spacing="0">6</text></g><g class="a" style="animation-delay:0.45s"><text x="32" y="186" font-family="'RS Sans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#fff0dc" text-anchor="start" letter-spacing="0">projects built end to end: UI,</text></g><g class="a" style="animation-delay:0.53s"><text x="32" y="208" font-family="'RS Sans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#fff0dc" text-anchor="start" letter-spacing="0">backend, database and deployment.</text></g></svg>