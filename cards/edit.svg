<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="SIDE QUEST: EDIT: 25+ reels edited, including paid work for a real estate client."><title>SIDE QUEST: EDIT: 25+ reels edited, including paid work for a real estate client.</title><style>
