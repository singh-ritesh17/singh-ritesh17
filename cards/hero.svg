<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Ritesh Singh. Full-stack developer in Pune. Video editing on the side."><title>Ritesh Singh. Full-stack developer in Pune. Video editing on the side.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes drift{from{stroke-dashoffset:0}to{stroke-dashoffset:-120}}
.a{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.g{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.p{transform-box:fill-box;transform-origin:50% 50%;animation:pop .5s ease-out both}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.drift{stroke-dasharray:6 14;animation:drift 12s linear infinite}
@media (prefers-reduced-motion:reduce){.a,.g,.p,.pulse,.drift{animation:none!important}}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e0407"/><stop offset="1" stop-color="#790b13"/></linearGradient><clipPath id="c"><rect width="1200" height="380" rx="28"/></clipPath></defs><g clip-path="url(#c)"><rect width="1200" height="380" fill="url(#g)"/><circle cx="1050" cy="190" r="90" fill="none" stroke="#cc9990" stroke-opacity="0.5" stroke-width="1.5"/><circle cx="1050" cy="190" r="170" fill="none" stroke="#cc9990" stroke-opacity="0.35" stroke-width="1.5" class="drift"/><circle cx="1050" cy="190" r="250" fill="none" stroke="#cc9990" stroke-opacity="0.22" stroke-width="1.5"/><circle cx="1050" cy="190" r="330" fill="none" stroke="#cc9990" stroke-opacity="0.12" stroke-width="1.5"/></g><g class="a" style="animation-delay:0.10s"><text x="72" y="84" font-family="'RS Sans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#cc9990" text-anchor="start" letter-spacing="4">FULL-STACK DEVELOPER  ·  PUNE</text></g><g class="a" style="animation-delay:0.25s"><text x="72" y="190" font-family="'RS Serif','Instrument Serif',Georgia,'Times New Roman',serif" font-size="104" fill="#fff0dc" text-anchor="start" letter-spacing="0">Ritesh Singh</text></g><g class="a" style="animation-delay:0.45s"><text x="72" y="250" font-family="'RS Sans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#fff0dc" text-anchor="start" letter-spacing="0">I build AI-powered products, from UI to deployment.</text></g><g class="a" style="animation-delay:0.60s"><text x="72" y="290" font-family="'RS Sans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#cc9990" text-anchor="start" letter-spacing="0">First-year CS student at SPPU. Video editing is my side quest.</text></g><g class="a" style="animation-delay:0.80s"><circle cx="78" cy="336" r="6" fill="#fff0dc" class="pulse"/><text x="96" y="342" font-family="'RS Sans','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif" font-size=